name: Compat

# Compatibility verification (weekly + per PR + on demand):
#   1. bare-import: install the packed tarball into an empty project and
#      import its entry - catches devDependencies mistaken for dependencies
#      and a broken prepare build.
#   2. profile: install the tarball into a scratch DSH_HOME profile next to
#      dsh-base + dsh-headless. The kit is a library (its bundle patch layer
#      mounts no plugin row), so the assertion is a successful add + remove
#      round trip rather than a dump-config row.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
  pull_request:

jobs:
  bare-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build and pack
        run: |
          pnpm run build
          pnpm pack --pack-destination "$RUNNER_TEMP"
      - name: Bare install + import smoke
        run: |
          set -euo pipefail
          TARBALL="$(ls "$RUNNER_TEMP"/perrylink-dsh-plugin-kit-*.tgz | head -n1)"
          mkdir -p "$RUNNER_TEMP/bare" && cd "$RUNNER_TEMP/bare"
          pnpm init >/dev/null
          pnpm add "$TARBALL" >/dev/null
          node --input-type=module -e "import('dsh-scaffold').then(m=>{if(typeof m.makeEventGate!=='function'){console.error('unexpected library face');process.exit(1)}}).catch(e=>{console.error(e);process.exit(1)})"
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build and pack
        run: |
          pnpm run build
          pnpm pack --pack-destination "$RUNNER_TEMP"
      - name: Install dsh CLI
        run: npm install -g @deepseek-ai/dsh@0.2.1-alpha.1
      - name: Install into a scratch profile
        run: |
          set -euo pipefail
          TARBALL="$(ls "$RUNNER_TEMP"/perrylink-dsh-plugin-kit-*.tgz | head -n1)"
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          mkdir -p "$DSH_HOME/profiles/compat"
          cat > "$DSH_HOME/profiles/compat/pnpm-workspace.yaml" <<'YAML'
          packages:
            - .
          minimumReleaseAge: 0
          nodeLinker: hoisted
          autoInstallPeers: false
          allowBuilds:
            '@deepseek-ai/dsh-subprocess-local': true
            koffi: true
            node-pty: true
            protobufjs: true
            '@google/genai': true
          YAML
          dsh plugin --profile compat add '@deepseek-ai/dsh-base@0.2.1-alpha.1' '@deepseek-ai/dsh-headless@0.2.1-alpha.1' "$TARBALL"
      - name: Uninstall (round trip)
        run: |
          set -euo pipefail
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          dsh plugin --profile compat remove dsh-scaffold
